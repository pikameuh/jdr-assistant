# =============================================================================
#  Clés API de l'assistant du meneur — MODÈLE
# =============================================================================
#  1. Copiez ce fichier sous le nom secrets.yaml, dans le même dossier.
#  2. Collez chaque clé après les deux-points, entre guillemets.
#  secrets.yaml n'est jamais envoyé sur git. Ne partagez jamais une clé.
#
#  Chaque clé doit venir du fournisseur choisi dans config.yaml pour cet usage :
#    fournisseur: anthropic  → clé commençant par sk-ant-  (console.anthropic.com)
#    fournisseur: openai     → clé commençant par sk-      (platform.openai.com)
#  Les deux entrées peuvent contenir la même clé.
#  Entrée laissée vide ("") : l'assistant cherche la clé dans la variable
#  d'environnement du fournisseur (ANTHROPIC_API_KEY ou OPENAI_API_KEY).
# =============================================================================

# Questions de règles (commande : uv run search)
recherche-apikey: ""

# Dialogue avec les PNJ (commande : uv run parler)
personas-apikey: ""
