# =============================================================================
#  Modèles proposés par l'interface web (menu « Modèle » de la fenêtre Config)
# =============================================================================
#  Une section par fournisseur. Pour proposer un nouveau modèle, ajoutez un bloc
#  « - nom: … » sous son fournisseur (nom exact donné par le fournisseur).
#  Les modèles Anthropic commencent par « claude- ».
#  Prix par million de jetons, entrée / sortie, relevés le 2026-11-16.
#  Rangés du moins cher au plus cher.
#  avertissement (facultatif) : affiché dans la fenêtre Config quand le
#  modèle est choisi, par exemple pour signaler un modèle léger.
# =============================================================================

anthropic:
  - nom: claude-haiku-5-5
    description: rapide et très économique
    prix: 0,10 $ / 0,50 $
    avertissement: "Modèle léger : plus de risque qu'un PNJ révèle un secret, sorte de son personnage ou oublie de consulter les règles (et invente alors un chiffre), et de réponses de règles moins précises. Non mesuré pour l'instant. Si cela arrive, choisissez un modèle plus puissant."
  - nom: claude-sonnet-5-5
    description: bon équilibre qualité / prix
    prix: 2 $ / 10 $
  - nom: claude-opus-5-5
    description: le plus soigné de la gamme Opus
    prix: 4 $ / 20 $
  - nom: claude-opus-4-8
    description: génération précédente d'Opus
    prix: 5 $ / 25 $

openai:
  - nom: gpt-6-luna
    description: économique, gros volumes
    prix: 0,10 $ / 0,50 $
    avertissement: "Modèle léger : plus de risque qu'un PNJ révèle un secret, sorte de son personnage ou oublie de consulter les règles (et invente alors un chiffre), et de réponses de règles moins précises. Non mesuré pour l'instant. Si cela arrive, choisissez un modèle plus puissant."
  - nom: gpt-6.1-terra
    description: rapide et efficace
    prix: 1 $ / 5 $
  - nom: gpt-6.1-sol
    description: équilibre intelligence / coût
    prix: 2 $ / 10 $
  - nom: gpt-6-astra
    description: le plus puissant d'OpenAI
    prix: 10 $ / 50 $
