# =============================================================================
#  Modèles proposés par l'interface web (menu « Modèle » de la fenêtre Config)
# =============================================================================
#  Une section par fournisseur. Pour proposer un nouveau modèle, ajoutez un bloc
#  « - nom: … » sous son fournisseur (nom exact donné par le fournisseur).
#  Les modèles Anthropic commencent par « claude- ».
#  Prix par million de jetons, entrée / sortie, relevés le 2026-11-16.
#  Rangés du moins cher au plus cher.
# =============================================================================

anthropic:
